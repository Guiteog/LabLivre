<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="container-main">
                
                <div class="login">
                    <header><img src="./img/logo.png" alt="Logo"></header>

                    <!-- Conteudo para entrar no site -->
                    <div class="main-login">

                        <!-- Textos Top -->
                        <div class="text">
                            <h1>LabLivre SENAI</h1>
                            <h2>Seu Laboratório de Conhecimento Aberto</h2>
                        </div>

                        <!-- Log-in && Log-up -->
                        <div class="btn-type">
                            <div class="btn-alterna">
                                <div class="btn-login"><input type="button" value="Log-in"></div>
                                <div class="btn-logup"><input type="button" value="Log-up"></div>
                            </div>
                        </div>

                    </div>                   
                </div>
                
                <!-- Capa lado da direita -->
                <div class="capa">
                    <img src="./img/capa.png" alt="Capa">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
